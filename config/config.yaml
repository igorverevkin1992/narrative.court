# ============================================================
# The Narrative Court - main configuration.
# Non-secret settings only. API keys live in the OS keyring / config/.env.
# Edited through the Config screen of the web UI, or by hand.
# ============================================================

app:
  port: 8080                       # NiceGUI default; change if occupied
  host: "127.0.0.1"                # local-only bind; never expose publicly
  language: "ru"                   # UI language: operator-facing strings are Russian
  episodes_dir: "./data/episodes"
  exports_dir: "./data/exports"
  logs_dir: "./data/logs"
  db_path: "./data/narrative_court.db"
  open_browser_on_start: true

generation_defaults:
  temperature: 0.7
  max_tokens: 800                  # full rounds; quickfire overrides to 60
  quickfire_max_tokens: 60         # ~45 words ~= 15 s of speech
  seed: null                       # null = random seed assigned per episode (logged)
  retry_attempts: 3                # tenacity attempts per call
  timeout_seconds: 120             # reasoning models (DeepSeek V4 / Claude extended) need headroom
  reasoning_timeout_seconds: 180   # used when behaviour_profile.reasoning == true
  max_parallel_requests: 4         # concurrency cap on live LLM calls (Block B.2 RPM/TPM safety)

tts_defaults:
  output_format: "pcm_44100"       # converted to WAV 44.1 kHz/16-bit on disk; Pro plan required
  el_model_id: "eleven_turbo_v2_5"
  batch_max_parallel: 3            # concurrent ElevenLabs requests
  presets_file: "./config/tts_presets.json"

quickfire:
  questions_generated: 12
  questions_selected: 10
  variability_method: "lexical"    # one of: lexical | embedding | llm_judge
  variability_threshold: 0.35      # 0..1; below => flagged "too similar"
  timer_seconds: 15

detector:
  deepseek_reasoning_min_chars: 80     # THRESHOLD for SUPPRESSED (see ТЗ Block C.1)
  deepseek_content_min_chars: 200      # MIN_CONTENT_LEN companion threshold
  hedging_evasive_threshold: 3         # >=3 hedging hits => EVASIVE
  hedging_weak_threshold: 1            # 1..2 hedging hits => WEAK

translation:
  drift_method: "keyword_overlap"      # one of: keyword_overlap | embedding | llm_judge
  drift_threshold: 0.70                # overlap below this => revert to original

timeline:
  fps: 30                              # timeline frame rate for FCPXML/EDL timecodes
  audio_sample_rate: 44100
  primary_format: "fcpxml"             # fcpxml | edl
  fallback_format: "edl"
  emit_otio: false                     # optional .otio convenience export

oxford:
  min_votes_quorum: 30                 # < 30 votes in either poll => no_quorum, win not counted

logging:
  retention_runs: 200                  # keep only the last N generation runs per model log (Block B.3)

